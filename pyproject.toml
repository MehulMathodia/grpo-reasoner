[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-reasoner"
version = "0.1.0"
description = "GRPO reinforcement-learning fine-tuning of a small LLM for verifiable math reasoning, with a rigorous eval harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehul Mathodia" }]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "trl>=0.11",
    "peft>=0.10",
    "accelerate>=0.30",
]

[tool.setuptools.packages.find]
include = ["grpo_reasoner*"]
